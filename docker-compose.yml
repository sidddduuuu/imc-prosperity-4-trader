services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=change-me-in-production
      - DATABASE_URL=sqlite:////app/data/atlas.db
      - CORS_ORIGINS=*
    volumes:
      - atlas-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  atlas-data:
