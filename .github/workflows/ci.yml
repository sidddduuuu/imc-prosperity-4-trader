name: CI

on:
  push:
  pull_request:

jobs:
  test-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest
      - name: Check historical benchmark
        run: >-
          python scripts/benchmark.py
          --baseline benchmarks/baseline.json
          --max-pnl-regression 0
